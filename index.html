<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="QMb64RIDO5ZrVY6kRDoAnvqyhWDyi6pD-P8g2T8URhE" />
    <title>ParaPoth</title>

    <script>
      (function () {
        try {
          const root = document.documentElement;
          const rawMode = localStorage.getItem('app_theme');
          const rawDynamicTheme = localStorage.getItem('dyn_theme');

          const normalizedMode =
            rawMode === '"dark"' || rawMode === 'dark'
              ? 'dark'
              : rawMode === '"light"' || rawMode === 'light'
                ? 'light'
                : 'system';

          const prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;

          const isDark =
            normalizedMode === 'dark' ||
            (normalizedMode === 'system' && prefersDark);

          const fallbackTheme = isDark
            ? {
                bg: '#0F172A',
                card: '#1E293B',
                text: '#F8FAFC',
                primary: '#3B82F6',
                accent: '#6366F1',
              }
            : {
                bg: '#F8FAFC',
                card: '#FFFFFF',
                text: '#0F172A',
                primary: '#2563EB',
                accent: '#4F46E5',
              };

          root.classList.remove('light', 'dark');
          root.classList.add(isDark ? 'dark' : 'light');
          root.style.colorScheme = isDark ? 'dark' : 'light';

          root.style.setProperty('--dyn-bg', fallbackTheme.bg);
          root.style.setProperty('--dyn-card', fallbackTheme.card);
          root.style.setProperty('--dyn-text', fallbackTheme.text);
          root.style.setProperty('--dyn-primary', fallbackTheme.primary);
          root.style.setProperty('--dyn-accent', fallbackTheme.accent);
          root.style.backgroundColor = fallbackTheme.bg;

          if (rawDynamicTheme) {
            try {
              const parsed = JSON.parse(rawDynamicTheme);

              if (parsed && typeof parsed === 'object') {
                if (typeof parsed.primaryBackground === 'string' && parsed.primaryBackground.trim()) {
                  root.style.setProperty('--dyn-bg', parsed.primaryBackground);
                  root.style.backgroundColor = parsed.primaryBackground;
                }

                if (typeof parsed.cardBackground === 'string' && parsed.cardBackground.trim()) {
                  root.style.setProperty('--dyn-card', parsed.cardBackground);
                }

                if (typeof parsed.textColor === 'string' && parsed.textColor.trim()) {
                  root.style.setProperty('--dyn-text', parsed.textColor);
                }

                if (typeof parsed.buttonColor === 'string' && parsed.buttonColor.trim()) {
                  root.style.setProperty('--dyn-primary', parsed.buttonColor);
                }

                if (typeof parsed.accentColor === 'string' && parsed.accentColor.trim()) {
                  root.style.setProperty('--dyn-accent', parsed.accentColor);
                }
              }
            } catch (_) {
              // Ignore corrupted cached theme and keep safe fallback values.
            }
          }

          const applyResolvedBodyTheme = function () {
            const computed = getComputedStyle(root);
            const resolvedBg = computed.getPropertyValue('--dyn-bg').trim() || fallbackTheme.bg;
            const resolvedText = computed.getPropertyValue('--dyn-text').trim() || fallbackTheme.text;

            root.style.backgroundColor = resolvedBg;

            if (document.body) {
              document.body.style.backgroundColor = resolvedBg;
              document.body.style.color = resolvedText;
            }
          };

          if (document.body) {
            applyResolvedBodyTheme();
          } else {
            document.addEventListener('DOMContentLoaded', applyResolvedBodyTheme, { once: true });
          }
        } catch (_) {
          const root = document.documentElement;
          root.classList.remove('dark');
          root.classList.add('light');
          root.style.colorScheme = 'light';
          root.style.backgroundColor = '#F8FAFC';
        }
      })();
    </script>

    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
      var vConsole = new window.VConsole();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
