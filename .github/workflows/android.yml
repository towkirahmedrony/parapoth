name: Android

on:
  workflow_dispatch:
    inputs:
      channel:
        description: OTA channel baked into this build
        required: true
        default: production-android
        type: choice
        options:
          - production-android
          - staging-android
  # Every push to main produces an installable debug APK, so a build is never
  # waiting on someone remembering to dispatch the workflow by hand.
  push:
    branches:
      - main
    tags:
      - 'android-v*'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      # `inputs` is empty on push events, so the default applies there too.
      APP_CHANNEL: ${{ inputs.channel || 'production-android' }}
      VITE_OTA_CHANNEL: ${{ inputs.channel || 'production-android' }}
      POROKH_OTA_CHANNEL: ${{ inputs.channel || 'production-android' }}
      # Same per-commit identity the website and the OTA bundle carry.
      POROKH_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ubuntu-latest ships a full Android SDK (android-36 + build-tools) with
      # licenses already accepted, so no separate SDK setup step is required.

      - run: npm ci

      - name: Configure frontend environment
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets are required; without them the app crashes on startup with a white screen."
            exit 1
          fi
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > .env.local

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run native:sync

      - name: Verify the packaged build manifest
        run: |
          set -euo pipefail
          manifest=android/app/src/main/assets/public/version.json
          test -f "$manifest" || { echo "::error::$manifest was not produced"; exit 1; }
          python3 - "$manifest" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)

          expected = os.environ["POROKH_BUILD_ID"][:12]
          if manifest.get("buildId") != expected:
              print(
                  f"::error::packaged buildId {manifest.get('buildId')} does not match commit {expected}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("packaged manifest", manifest)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: porokh-${{ env.APP_CHANNEL }}-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summarise the build
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          size=$(du -h "$apk" | cut -f1)
          version_name=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          version_code=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          {
            echo "### Porokh debug APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Channel | ${APP_CHANNEL} |"
            echo "| APK | $(basename "$apk") (${size}) |"
            echo "| versionName / versionCode | ${version_name} / ${version_code} |"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
