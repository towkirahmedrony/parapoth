name: Android

on:
  workflow_dispatch:
    inputs:
      channel:
        description: OTA channel baked into this build
        required: true
        default: production-android
        type: choice
        options:
          - production-android
          - staging-android
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      APP_CHANNEL: ${{ github.event.inputs.channel || 'production-android' }}
      VITE_OTA_CHANNEL: ${{ github.event.inputs.channel || 'production-android' }}
      POROKH_OTA_CHANNEL: ${{ github.event.inputs.channel || 'production-android' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ubuntu-latest ships a full Android SDK (android-36 + build-tools) with
      # licenses already accepted, so no separate SDK setup step is required.

      - run: npm ci

      - name: Configure frontend environment
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets are required; without them the app crashes on startup with a white screen."
            exit 1
          fi
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > .env.local

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run native:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: porokh-${{ env.APP_CHANNEL }}-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
